# Settings for the experiment tools. It isn't a package to install: run them from here.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
# The tests import power.py from this folder
pythonpath = ["."]
testpaths = ["tests"]
# Dash's pytest plugin lives in the same venv; these tests don't use it
addopts = "-p no:dash"
