version: 2

models:
  - name: fct_streaks
    description: One row per streak of mornings read in a row.
    columns:
      - name: streak_id
        tests: [unique, not_null]
      - name: length_days
        tests: [not_null]

  - name: fct_retention_cohorts
    description: >
      One row per signup week per persona: how many readers read again 1, 7 and 30 days
      after joining, counting only readers who have been around long enough to have that
      day. For everyone together, add the rows up.
    columns:
      - name: cohort_id
        tests: [unique, not_null]
      - name: cohort_week
        tests: [not_null]
      - name: persona
        tests:
          - accepted_values:
              arguments:
                values: [early_riser, commuter, weekend_reader, app]

  - name: dim_users
    description: One row per reader, including those who never read.
    columns:
      - name: user_key
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_key

  - name: fct_daily_activity
    description: >
      One row per day per persona, in readers' own time zones: readers who had joined,
      readers who read, and the share of readers who opened a reading that finished one.
      Feeds the dashboard.
    columns:
      - name: activity_id
        tests: [unique, not_null]
      - name: local_day
        tests: [not_null]
      - name: persona
        tests:
          - accepted_values:
              arguments:
                values: [early_riser, commuter, weekend_reader, app]
      - name: readers_so_far
        description: Readers of this persona who had joined by this day
      - name: active_readers
        description: Of those, how many finished a reading this day
      - name: opened_reading
        description: Readers who opened a reading this day
      - name: finished_reading
        description: Readers who opened a reading this day and finished one
      - name: completion_rate
        description: finished_reading / opened_reading, blank on a day nobody opened one

  - name: fct_reading_times
    description: >
      One row per persona per half hour of the reader's own day (0 is 00:00 to 00:29,
      47 is 23:30 to 23:59): how many readings were finished then. Feeds the reading clock.
    columns:
      - name: slot_id
        tests: [unique, not_null]
      - name: persona
        tests:
          - accepted_values:
              arguments:
                values: [early_riser, commuter, weekend_reader, app]

  - name: fct_experiment
    description: >
      One row per reader in the reminder experiment: their group (A or B) and the measures
      the pre-registration decides on (docs/analysis/reminder-experiment.md). Day-1 and
      day-7 return count only when the reader has had that day. The finish rate guardrail
      is first_week_finished / first_week_opened, added up over a group's readers.
    columns:
      - name: user_key
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_key
      - name: reminder_variant
        description: The group the coin gave them when they joined, kept for good
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [A, B]
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: [app, synthetic]
      - name: can_have_day_7
        description: The data reaches the reader's 7th day after joining, so their day 7 counts
      - name: read_day_7
        description: They finished a reading on that day (the primary measure)
      - name: first_week_opened
        description: Days 0 to 7 on which they opened a reading
      - name: first_week_finished
        description: Of those days, the ones on which they finished a reading

  - name: fct_reader_nights
    description: >
      One row per reader per night, for the streak-at-risk model (Card 7): what was known
      about them by the end of that day, and whether they missed the next morning. Every
      feature looks only at that night and the days before it. Nights whose next morning has
      no data yet are left out.
    columns:
      - name: user_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_key
      - name: night
        tests: [not_null]
      - name: streak_days
        description: Mornings read in a row, ending tonight (0 if they didn't read today).
        tests: [not_null]
      - name: days_since_last_read
        description: 0 if they read today. For someone who has never read, the days since they joined, plus one.
        tests: [not_null]
      - name: read_rate_7d
        description: Share of the last 7 days (or fewer, if newer) with a finished reading.
        tests: [not_null]
      - name: read_time_spread_14d
        description: How much their reading time wandered over the last 14 days, in minutes. Empty with fewer than two reads.
      - name: tomorrow_weekday
        description: The morning being predicted, 1 for Monday to 7 for Sunday.
        tests: [not_null]
      - name: missed_tomorrow
        description: The label. True if they didn't finish a reading the next morning.
        tests: [not_null]

  - name: fct_reader_tonight
    description: >
      One row per reader on a streak tonight (Card 7.5): everyone who read on the last day of
      their source's data, with the same features as fct_reader_nights and no label, because
      their next morning hasn't happened yet. ml/score_tonight.py scores it.
    columns:
      - name: user_key
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_key
      - name: night
        description: The last day of their source's data, in the reader's own time.
        tests: [not_null]
      - name: streak_days
        description: Mornings read in a row, ending tonight. At least 1, since they read today.
        tests: [not_null]
      - name: tomorrow_weekday
        description: The morning being predicted, 1 for Monday to 7 for Sunday.
        tests: [not_null]

  - name: fct_reader_habits
    description: >
      One row per reader: their reading habits, for finding reader personas (Card 7.6).
      Behaviour only; the simulator's persona is the answer key and never comes in here.
      Times are minutes after midnight on the reader's own clock, from their first finished
      reading each day.
    columns:
      - name: user_key
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_key
      - name: reads
        description: Days with a finished reading.
        tests: [not_null]
      - name: weekday_minute
        description: Average time of their first reading on Monday to Friday (330 is 05:30). Empty with no weekday reads.
      - name: weekend_minute
        description: The same on Saturday and Sunday.
      - name: weekend_share
        description: Share of their reading days that fall at weekends. Empty with no reads.
      - name: read_minute_spread
        description: How much their reading time wanders, in minutes. Empty with fewer than two reads.

  - name: fct_reader_starts
    description: >
      One row per reader per day they started reading, for finding the best reminder time
      (Card 7.7): the first reading they opened that day, on their own clock, and how long
      after their wake time that was.
    columns:
      - name: user_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_key
      - name: local_day
        description: The day, on the reader's own clock.
        tests: [not_null]
      - name: at_weekend
        description: Saturday or Sunday, on the reader's own clock.
        tests: [not_null]
      - name: started_minute
        description: When they opened their first reading that day, in minutes after midnight (330.5 is 05:30:30).
      - name: wake_minute
        description: The wake time they set in the app, in minutes after midnight.
      - name: minutes_after_wake
        description: How long after their wake time they started. Negative if they started before it.
        tests: [not_null]
