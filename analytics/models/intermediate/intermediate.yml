version: 2

models:
  - name: int_last_day
    description: >
      The last day with any data for each source of readers, in their own time. The pretend
      readers' calendar ends with the simulation and real readers' goes on, so a real reading
      never stretches the pretend readers' calendar.
    columns:
      - name: source
        tests: [unique, not_null]
      - name: last_day
        tests: [not_null]

  - name: int_daily_reading
    description: >
      One row per reader per local day, from the day they joined to the last day with data
      from their own source (int_last_day), including days with no reading.
    columns:
      - name: user_key
        tests: [not_null]
      - name: local_day
        tests: [not_null]
      - name: days_since_signup
        description: 0 on the day they joined, 1 the day after, and so on.

  - name: int_reader_nights
    description: >
      One row per reader per night with the streak-at-risk model's features, worked out once
      (Card 7.5). fct_reader_nights (the training data) and fct_reader_tonight (what the model
      is asked about) both read from here, so their features can't drift apart.
      reads_tomorrow is empty on each reader's last night.
    columns:
      - name: user_key
        tests: [not_null]
      - name: night
        tests: [not_null]
