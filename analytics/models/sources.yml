version: 2

sources:
  - name: raw
    description: The lake's lines as rows, loaded by pipelines/ingest (Card 5.3)
    schema: raw
    tables:
      - name: events
        description: One row per event, real (source "app") and pretend (source "synthetic")
      - name: readers
        description: The pretend readers from ml/simulate.py

  - name: app
    description: The app's own tables, kept by the API
    schema: public
    tables:
      - name: users
        description: Real readers, one per phone
