

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: manna
      POSTGRES_PASSWORD: manna
      POSTGRES_DB: manna
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manna"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://manna:manna@db:5432/manna
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
