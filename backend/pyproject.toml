

[project]
name = "morning-manna-api"
version = "0.1.0"
description = "FastAPI backend for the Morning Manna Bible app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=2.13",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Alembic: don't enforce line length or import order there
"alembic/versions/*" = ["E501", "I001"]
