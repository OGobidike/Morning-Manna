

[project]
name = "morning-manna-ml"
version = "0.1.0"
description = "Pretend readers, and the models that learn from them, for Morning Manna"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
# The models (Card 7.2): about 107 MB in all. xgboost-cpu is XGBoost without the 291 MB of
# GPU libraries the full package pulls in, which nothing here uses
models = [
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "xgboost-cpu>=2.1",
    "lightgbm>=4.5",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "plotly>=5.24",
]
# Tracking and versioning the models (Card 7.3): about 113 MB more. The full package, because
# mlflow-skinny can't keep its own records or show the web page
tracking = [
    "mlflow>=3.18",
]
# The model service (Card 7.4): FastAPI and uvicorn already come with MLflow, so only httpx2
# (about 200 KB, for FastAPI's test client) is new
serving = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx2>=2.13",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "simulate", "streak_risk", "streak_risk_charts", "model_registry", "serve", "score_tonight",
    "personas", "personas_charts",
]

[tool.pytest.ini_options]
# MLflow's own code raises deprecation warnings from the libraries it uses; ours still show
filterwarnings = [
    "ignore:::mlflow.*",
    "ignore:Hint. Inferred schema contains integer column:UserWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
