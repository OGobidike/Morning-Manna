

[project]
name = "morning-manna-ml"
version = "0.1.0"
description = "Pretend readers, and the models that learn from them, for Morning Manna"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
# The models (Card 7.2): about 107 MB in all. xgboost-cpu is XGBoost without the 291 MB of
# GPU libraries the full package pulls in, which nothing here uses
models = [
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "xgboost-cpu>=2.1",
    "lightgbm>=4.5",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "plotly>=5.24",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["simulate", "streak_risk", "streak_risk_charts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
