

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres, started fresh for every CI run and deleted afterwards
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manna
          POSTGRES_PASSWORD: manna
          POSTGRES_DB: manna
        ports:
          - 5432:5432
        # Wait until Postgres is ready before running the steps
        options: >-
          --health-cmd "pg_isready -U manna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # Where the backend finds the database (read by app/config.py)
    env:
      DATABASE_URL: postgresql+psycopg://manna:manna@localhost:5432/manna

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Migrations build an empty database
        run: alembic upgrade head
      - name: Migrations roll back cleanly
        run: alembic downgrade base
      - name: Migrations re-apply after rollback
        run: alembic upgrade head
      - name: Models and migrations agree
        run: alembic check

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
