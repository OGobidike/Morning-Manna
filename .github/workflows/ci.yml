

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres, started fresh for every CI run and deleted afterwards
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manna
          POSTGRES_PASSWORD: manna
          POSTGRES_DB: manna
        ports:
          - 5432:5432
        # Wait until Postgres is ready before running the steps
        options: >-
          --health-cmd "pg_isready -U manna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # Where the backend finds the database (read by app/config.py)
    env:
      DATABASE_URL: postgresql+psycopg://manna:manna@localhost:5432/manna

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Migrations build an empty database
        run: alembic upgrade head
      - run: pytest --cov
      - name: Migrations roll back cleanly
        run: alembic downgrade base
      - name: Migrations re-apply after rollback
        run: alembic upgrade head
      - name: Models and migrations agree
        run: alembic check

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  pipelines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines
    # The loader's tests need a real Postgres, like the backend's
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manna
          POSTGRES_PASSWORD: manna
          POSTGRES_DB: manna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://manna:manna@localhost:5432/manna
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
    
  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same image docker compose builds: Airflow, plus each job's own Python
      - name: Build the Airflow image
        run: docker build -f pipelines/Dockerfile -t manna-airflow .
      - name: Each job's Python can load its code
        run: |
          docker run --rm --entrypoint "" manna-airflow \
            /home/airflow/venvs/pipelines/bin/python -c "import ingest.load_events"
          docker run --rm --entrypoint "" manna-airflow \
            /home/airflow/venvs/backend/bin/python -c "import app.etl.__main__"
          docker run --rm --entrypoint "" manna-airflow /home/airflow/venvs/dbt/bin/dbt --version
      # The DAG tests run inside the image, so they test the exact Airflow we run
      - name: DAG tests
        run: >
          docker run --rm --entrypoint "" -v "$PWD/pipelines:/opt/manna/pipelines:ro"
          manna-airflow bash -c "pip install -q pytest &&
          python -m pytest -p no:cacheprovider /opt/manna/pipelines/dag_tests"

  analytics:
    runs-on: ubuntu-latest
    # Builds the warehouse from nothing, the way it's built for real: the app's tables,
    # pretend readers, a lake, the loader, then every dbt model and test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manna
          POSTGRES_PASSWORD: manna
          POSTGRES_DB: manna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://manna:manna@localhost:5432/manna
      LAKE_URL: http://localhost:8333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the backend, the simulator and the loader
        run: pip install -e backend -e ml -e "pipelines[dev]"
      # dbt and the notebooks share a venv of their own, as on Kai's PC, apart from the app's
      - name: Install dbt and the notebooks' libraries
        run: |
          python -m venv .dbt
          .dbt/bin/pip install -r analytics/requirements.txt -r analytics/notebooks/requirements.txt
      - name: Create the app's tables
        working-directory: backend
        run: alembic upgrade head
      # A fixed end date and the default seed make exactly the same readers every run
      - name: Make 90 days of pretend readers
        run: python ml/simulate.py --end 2026-10-27
      # moto stands in for SeaweedFS: CI service containers can't be given its start command
      - name: Fill a stand-in lake, then load it into the warehouse
        run: |
          moto_server -p 8333 > /dev/null 2>&1 &
          timeout 30 bash -c "until curl -s localhost:8333 > /dev/null; do sleep 1; done"
          python -m ingest.upload
          python -m ingest.load_events --all
      - name: Build and test every model
        working-directory: analytics
        run: ../.dbt/bin/dbt build
      - name: Retention, for the record
        working-directory: analytics
        run: |
          ../.dbt/bin/dbt show --inline "
            select
                round(sum(day_1_returned)::numeric / nullif(sum(day_1_eligible), 0), 3) as day_1,
                round(sum(day_7_returned)::numeric / nullif(sum(day_7_eligible), 0), 3) as day_7,
                round(sum(day_30_returned)::numeric / nullif(sum(day_30_eligible), 0), 3) as day_30
            from {{ ref('fct_retention_cohorts') }}"
      # Every notebook must run from top to bottom on the fresh warehouse, so none goes stale
      - name: Run the notebooks
        working-directory: analytics/notebooks
        run: ../../.dbt/bin/jupyter nbconvert --execute --to notebook --output-dir /tmp/ran *.ipynb
      # Outputs and run details make diffs unreadable, so notebooks are committed without them
      - name: The notebooks are saved without their outputs
        working-directory: analytics/notebooks
        run: |
          ../../.dbt/bin/jupyter nbconvert --clear-output --ClearMetadataPreprocessor.enabled=True \
            --inplace *.ipynb
          git diff --exit-code -- .
