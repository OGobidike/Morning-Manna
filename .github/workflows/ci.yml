

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres, started fresh for every CI run and deleted afterwards
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: manna
          POSTGRES_PASSWORD: manna
          POSTGRES_DB: manna
        ports:
          - 5432:5432
        # Wait until Postgres is ready before running the steps
        options: >-
          --health-cmd "pg_isready -U manna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # Where the backend finds the database (read by app/config.py)
    env:
      DATABASE_URL: postgresql+psycopg://manna:manna@localhost:5432/manna

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Migrations build an empty database
        run: alembic upgrade head
      - run: pytest --cov
      - name: Migrations roll back cleanly
        run: alembic downgrade base
      - name: Migrations re-apply after rollback
        run: alembic upgrade head
      - name: Models and migrations agree
        run: alembic check

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    # Postgres with pgvector, for the verse embeddings' storage tests (Card 8.1)
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: manna
          POSTGRES_PASSWORD: manna
          POSTGRES_DB: manna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://manna:manna@localhost:5432/manna

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The models' libraries (about 107 MB), MLflow (about 113 MB), the service's test client
      # and the embedding libraries (about 33 MB; the tests never download the model itself)
      - run: pip install -e ".[dev,models,tracking,serving,nlp]"
      - run: ruff check .
      - run: pytest

  pipelines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines
    # The loader's tests need a real Postgres, like the backend's
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: manna
          POSTGRES_PASSWORD: manna
          POSTGRES_DB: manna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://manna:manna@localhost:5432/manna
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
    
  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same image docker compose builds: Airflow, plus each job's own Python
      - name: Build the Airflow image
        run: docker build -f pipelines/Dockerfile -t manna-airflow .
      - name: Each job's Python can load its code
        run: |
          docker run --rm --entrypoint "" manna-airflow \
            /home/airflow/venvs/pipelines/bin/python -c "import ingest.load_events"
          docker run --rm --entrypoint "" manna-airflow \
            /home/airflow/venvs/backend/bin/python -c "import app.etl.__main__"
          docker run --rm --entrypoint "" manna-airflow /home/airflow/venvs/dbt/bin/dbt --version
      # The models' Python (Card 9): the retrain, the nightly scoring, the ML service and the
      # MLflow server. LightGBM proves the image has its system library; the server must reach
      # the lake (boto3) and its records (psycopg): a missing library fails here, not on Kai's PC
      - name: The models' Python can load the jobs, the service and the MLflow server
        run: |
          docker run --rm --entrypoint "" -v "$PWD/ml:/opt/manna/ml:ro" -w /opt/manna/ml manna-airflow \
            /home/airflow/venvs/ml/bin/python -c "import lightgbm, model_registry, score_tonight, serve"
          docker run --rm --entrypoint "" manna-airflow \
            /home/airflow/venvs/ml/bin/python -c "import boto3, psycopg, mlflow.server"
      # The DAG tests run inside the image, so they test the exact Airflow we run
      - name: DAG tests
        run: >
          docker run --rm --entrypoint "" -v "$PWD/pipelines:/opt/manna/pipelines:ro"
          manna-airflow bash -c "pip install -q pytest &&
          python -m pytest -p no:cacheprovider /opt/manna/pipelines/dag_tests"

  analytics:
    runs-on: ubuntu-latest
    # Builds the warehouse from nothing, the way it's built for real: the app's tables,
    # pretend readers, a lake, the loader, then every dbt model and test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: manna
          POSTGRES_PASSWORD: manna
          POSTGRES_DB: manna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://manna:manna@localhost:5432/manna
      LAKE_URL: http://localhost:8333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the backend, the simulator and its models, and the loader
        run: pip install -e backend -e "ml[models]" -e "pipelines[dev]"
      # dbt, the notebooks and the dashboard share a venv of their own, as on Kai's PC
      - name: Install dbt, the notebooks' and the dashboard's libraries
        run: |
          python -m venv .dbt
          .dbt/bin/pip install -r analytics/requirements.txt \
            -r analytics/notebooks/requirements.txt -r analytics/dashboard/requirements.txt
      - name: Create the app's tables
        working-directory: backend
        run: alembic upgrade head
      # A fixed end date and the default seed make exactly the same readers every run
      - name: Make 90 days of pretend readers
        run: python ml/simulate.py --end 2026-10-27
      # moto stands in for SeaweedFS: CI service containers can't be given its start command
      - name: Fill a stand-in lake, then load it into the warehouse
        run: |
          moto_server -p 8333 > /dev/null 2>&1 &
          timeout 30 bash -c "until curl -s localhost:8333 > /dev/null; do sleep 1; done"
          python -m ingest.upload
          python -m ingest.load_events --all
      - name: Build and test every model
        working-directory: analytics
        run: ../.dbt/bin/dbt build
      - name: Retention, for the record
        working-directory: analytics
        run: |
          ../.dbt/bin/dbt show --inline "
            select
                round(sum(day_1_returned)::numeric / nullif(sum(day_1_eligible), 0), 3) as day_1,
                round(sum(day_7_returned)::numeric / nullif(sum(day_7_eligible), 0), 3) as day_7,
                round(sum(day_30_returned)::numeric / nullif(sum(day_30_eligible), 0), 3) as day_30
            from {{ ref('fct_retention_cohorts') }}"
      # The reminder experiment's group sizes, then its analysis, by the rules written down
      # before it began (docs/analysis/reminder-experiment.md)
      - name: The experiment's groups, for the record
        working-directory: analytics
        run: |
          ../.dbt/bin/dbt show --inline "
            select
                reminder_variant,
                count(*) as readers,
                count(*) filter (where can_have_day_7) as reached_day_7
            from {{ ref('fct_experiment') }}
            group by reminder_variant
            order by reminder_variant"
      - name: The experiment's result
        working-directory: analytics/experiments
        run: ../../.dbt/bin/python analyze.py
      # Every notebook must run from top to bottom on the fresh warehouse, so none goes stale
      - name: Run the notebooks
        working-directory: analytics/notebooks
        run: ../../.dbt/bin/jupyter nbconvert --execute --to notebook --output-dir /tmp/ran *.ipynb
      # Outputs and run details make diffs unreadable, so notebooks are committed without them
      - name: The notebooks are saved without their outputs
        working-directory: analytics/notebooks
        run: |
          ../../.dbt/bin/jupyter nbconvert --clear-output --ClearMetadataPreprocessor.enabled=True \
            --inplace *.ipynb
          git diff --exit-code -- .
      # Tableau Public reads the committed files, so they must match the warehouse just built
      - name: The Tableau files are up to date
        working-directory: analytics/experiments
        run: |
          ../../.dbt/bin/python tableau.py
          git diff --exit-code -- ../tableau
          test -z "$(git status --porcelain -- ../tableau)"  # and no new file left uncommitted
      # The dashboard's numbers, checked against the warehouse just built and the answer key
      - name: Lint and test the dashboard
        working-directory: analytics/dashboard
        run: |
          ../../.dbt/bin/ruff check .
          ../../.dbt/bin/pytest
      # The A/B test's maths (sample sizes and the analysis), checked against known answers
      - name: Lint and test the experiment tools
        working-directory: analytics/experiments
        run: |
          ../../.dbt/bin/ruff check .
          ../../.dbt/bin/pytest
      # The streak-at-risk models (Card 7.2), trained and graded on the warehouse just built
      # (about 25 seconds). Tree models can round differently on another processor, so a
      # leaderboard that differs from the committed one is flagged, not failed
      - name: The streak-at-risk models, for the record
        run: |
          python ml/streak_risk.py
          git diff --quiet -- ml/results || echo "::notice::The leaderboard differs from ml/results/streak_risk.csv"
      # The reader personas (Card 7.6): found from habits alone, graded against the answer key
      - name: The reader personas, for the record
        run: |
          python ml/personas.py
          git diff --quiet -- ml/results/personas.csv || echo "::notice::The personas differ from ml/results/personas.csv"

      # The best reminder time (Card 7.7): built on the personas, graded night by night
      - name: The reminder times, for the record
        run: |
          python ml/reminder_time.py
          git diff --quiet -- ml/results/reminder_time.csv || echo "::notice::The reminder times differ from ml/results/reminder_time.csv"
